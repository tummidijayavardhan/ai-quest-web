name: Assemble and publish AI Quest

on:
  push:
    branches: [agent/ai-quest-deploy]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified production bundle
        run: |
          mkdir -p "$(dirname '_expo/static/js/web/index-359075ae4943000f460c3504f70eec32.js')"
          cat .deploy/bundle.part* > '_expo/static/js/web/index-359075ae4943000f460c3504f70eec32.js'
          test "$(wc -c < '_expo/static/js/web/index-359075ae4943000f460c3504f70eec32.js')" -eq 1801386
          grep -q 'AI Infrastructure' '_expo/static/js/web/index-359075ae4943000f460c3504f70eec32.js'
          grep -q 'Submit Feedback on GitHub' '_expo/static/js/web/index-359075ae4943000f460c3504f70eec32.js'
          if grep -q 'mailto:' '_expo/static/js/web/index-359075ae4943000f460c3504f70eec32.js'; then exit 1; fi
      - name: Publish atomically to GitHub Pages
        run: |
          find _expo/static/js/web -type f -name 'index-*.js' ! -name 'index-359075ae4943000f460c3504f70eec32.js' -delete
          rm -rf .deploy .github
          cp index.html 404.html
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy AI Quest infrastructure expansion'
          git push origin HEAD:gh-pages --force
